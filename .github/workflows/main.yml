name: Build Millionaire Syria APK
on:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK with retry
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          for attempt in 1 2 3; do
            if sdkmanager --install "ndk;28.2.13676358"; then
              break
            fi
            echo "NDK installation attempt $attempt failed; cleaning partial install and retrying..."
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
            rm -rf "$ANDROID_HOME/.temp"
            if [ "$attempt" -eq 3 ]; then
              echo "NDK installation failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: millionaire-syria-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
