name: Build Millionaire Syria APK
on:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          cache: true

      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK root was not provided by the runner."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install "ndk;28.2.13676358"; then
              exit 0
            fi
            echo "NDK installation attempt $attempt failed; removing incomplete files..."
            rm -rf "$SDK_ROOT/ndk/28.2.13676358"
            rm -rf "$SDK_ROOT/.temp"
            if [ "$attempt" -eq 3 ]; then
              echo "NDK installation failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: millionaire-syria-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
